# seed_jobs.yaml → job_registry
# cron 时区 Asia/Shanghai。enabled 为 true 的作业在调度容器启动后按时刻表运行。

jobs:
  - job_name: j_trade_cal
    domain: D0
    target_tables: [trade_cal, session_def]
    schedule_cron: "0 0 1 1 *"  # 每年1/1全量 + 每月1日核对
    source_chain: ["sina"]
    retry_policy: {"tries": 3, "backoff_s": [5, 30, 120]}
    timeout_s: 300
    critical: true
    enabled: true
    note: "交易日历。缺日用新浪交易日列表补，已有行不改。2026-10-11 补到 2026-12-31"

  - job_name: j_instrument_master
    domain: auxiliary
    target_tables: [instrument_master]
    schedule_cron: "0 8 * * *"
    source_chain: ["akshare", "eastmoney"]
    retry_policy: {"tries": 3, "backoff_s": [5, 30, 120]}
    timeout_s: 600
    critical: false
    enabled: true
    note: "证券主档日更"

  - job_name: j_global_overnight
    domain: D7
    target_tables: [global_daily]
    schedule_cron: "30 7 * * 1-5"
    source_chain: ["tencent", "eastmoney", "sina", "akshare"]
    retry_policy: {"tries": 3, "backoff_s": [5, 30, 120]}
    timeout_s: 600
    critical: true
    enabled: true
    note: "隔夜全球 07:30。美股按报价时间的次日北京日期写入，报价未更新不新开一天。商品收盘=昨结算。恒生不在本作业，16:00 由 j_global_asia 写"

  - job_name: j_global_asia
    domain: D7
    target_tables: [global_daily]
    schedule_cron: "0 16 * * 1-5"
    source_chain: ["tencent"]
    retry_policy: {"tries": 3, "backoff_s": [5, 30, 120]}
    timeout_s: 600
    critical: true
    enabled: true
    note: "亚洲收盘 16:00。现只写恒生、国企指数；日经和韩国指数本机没有可用源"

  - job_name: j_global_minute_pre
    domain: D7
    target_tables: [global_minute]
    schedule_cron: "*/15 6-9 * * 1-5"
    source_chain: ["tencent"]
    retry_policy: {"tries": 3, "backoff_s": [5, 30, 120]}
    timeout_s: 120
    critical: false
    enabled: true
    note: "盘前15min。腾讯 hf_ES。纳指期货代码无报价。2026-10-11 梁总要求未完成项收口后启用"

  - job_name: j_index_daily
    domain: D1
    target_tables: [index_daily]
    schedule_cron: "10 15 * * 1-5"
    source_chain: ["mootdx", "tencent", "akshare", "eastmoney"]
    retry_policy: {"tries": 3, "backoff_s": [5, 30, 120]}
    timeout_s: 300
    critical: true
    enabled: true
    note: "六大指数日K 15:10"

  - job_name: j_index_minute
    domain: D1
    target_tables: [index_minute]
    schedule_cron: "2 10-12,14-16 * * 1-5;32 11 * * 1-5"
    source_chain: ["tencent", "eastmoney"]
    retry_policy: {"tries": 3, "backoff_s": [5, 30, 120]}
    timeout_s: 600
    critical: false
    enabled: true
    note: "六大指数1m。10/11/12/14/15/16点02分，上午收盘后再于11:32补上11:00–11:30。腾讯分钟量，新浪分钟额，东财断开时作备源。目标日仍有空额则本次不算成功"

  - job_name: j_stock_daily
    domain: D2
    target_tables: [stock_daily]
    schedule_cron: "30 15 * * 1-5"
    source_chain: ["akshare", "tencent", "mootdx"]
    retry_policy: {"tries": 3, "backoff_s": [5, 30, 120]}
    timeout_s: 1800
    critical: true
    enabled: true
    note: "全市场个股日K 15:30（东财全市场快照→逐股kline兜底）"

  - job_name: j_etf_daily
    domain: D2
    target_tables: [etf_daily]
    schedule_cron: "35 15 * * 1-5"
    source_chain: ["sina", "tencent"]
    retry_policy: {"tries": 3, "backoff_s": [5, 30, 120]}
    timeout_s: 600
    critical: false
    enabled: true
    note: "ETF日K。新浪拿代码，腾讯报价，时间戳必须等于交易日"

  - job_name: j_zt_pools
    domain: D3
    target_tables: [zt_pool, zb_pool, dt_pool, yzt_pool]
    schedule_cron: "15 15 * * 1-5"
    source_chain: ["ths", "eastmoney"]
    retry_policy: {"tries": 3, "backoff_s": [5, 30, 120]}
    timeout_s: 600
    critical: true
    enabled: true
    note: "涨停/炸板/跌停池 15:15。主源同花顺 dataapi（东财 push2ex 本机 rc=205）。昨涨今现池源端无日期端点，显式 MISS"

  - job_name: j_sentiment_calc
    domain: D3
    target_tables: [sentiment_daily]
    schedule_cron: "40 15 * * 1-5"
    source_chain: ["eastmoney", "akshare"]
    retry_policy: {"tries": 3, "backoff_s": [5, 30, 120]}
    timeout_s: 300
    critical: true
    enabled: true
    note: "情绪日度汇总 15:40（依赖j_zt_pools+j_stock_daily）；龙虎Emotion待Z2"

  - job_name: j_bidding_list
    domain: D3
    target_tables: [bidding_list]
    schedule_cron: "26 9 * * 1-5"
    source_chain: ["tencent", "eastmoney"]
    retry_policy: {"tries": 3, "backoff_s": [2, 5, 10]}
    timeout_s: 600
    critical: false
    enabled: true
    note: "竞价列表09:26终版。P2-1修复：启用以捕获09:25撮合后完整数据（jjje/jjcje/jjhs有值率应>90%）"

  - job_name: j_stock_minute
    domain: D2
    target_tables: [stock_minute]
    schedule_cron: "35 11 * * 1-5;45 15 * * 1-5"
    source_chain: ["tencent", "sina"]
    retry_policy: {"tries": 3, "backoff_s": [5, 30, 120]}
    timeout_s: 3600
    critical: false
    enabled: true
    note: "全市场个股1m。11:35拉上午，15:45收盘后补全天。沪深腾讯分钟价量，新浪补成交额（元）和分时均价。北交所走分时。定时只落当天，额不足八成则本次不算成功"

  - job_name: j_verify_daily
    domain: pipeline
    target_tables: [verify_source, verify_diff]
    schedule_cron: "0 17 * * 1-5"
    source_chain: ["tencent", "mootdx"]
    retry_policy: {"tries": 2, "backoff_s": [10, 60]}
    timeout_s: 900
    critical: false
    enabled: true
    note: "双源复核 17:00。上证收盘对腾讯现价，差超过 1 点记 FAIL"

  - job_name: j_backfill_daily
    domain: pipeline
    target_tables: []
    schedule_cron: "0 7 * * 1-5"
    source_chain: ["tencent", "mootdx", "akshare", "eastmoney"]
    retry_policy: {"tries": 2, "backoff_s": [10, 60]}
    timeout_s: 1800
    critical: false
    enabled: true
    note: "次日补采 07:00。上一交易日关键表为空才重跑，有行的跳过"

  - job_name: j_coverage_check
    domain: pipeline
    target_tables: []
    schedule_cron: "15 7 * * 1-5"
    source_chain: ["internal"]
    retry_policy: {"tries": 1, "backoff_s": [5]}
    timeout_s: 300
    critical: true
    enabled: true
    note: "覆盖率检查 07:15。指数、个股、涨停、板块、资金流向上一交易日为 0 则 FAIL"

  - job_name: j_heartbeat
    domain: pipeline
    target_tables: [ingest_log]
    schedule_cron: "*/15 * * * *"
    source_chain: ["internal"]
    retry_policy: {"tries": 1, "backoff_s": [5]}
    timeout_s: 30
    critical: false
    enabled: true
    note: "心跳 每15min"

  - job_name: j_daily_report
    domain: pipeline
    target_tables: []
    schedule_cron: "45 16 * * 1-5"
    source_chain: ["internal"]
    retry_policy: {"tries": 1, "backoff_s": [5]}
    timeout_s: 120
    critical: false
    enabled: true
    note: "采集日报 16:45。汇总当天 ingest_log，尚未接飞书 webhook"

  # ─── Z8 W2b: lovetrade 迁移作业 ────────────────────────────────────

  - job_name: j_topic_sync
    domain: D6
    target_tables: [topic, topic_category, topic_group, topic_links]
    schedule_cron: "0 8 * * 1-5"
    source_chain: ["longhu"]
    retry_policy: {"tries": 2, "backoff_s": [30, 120]}
    timeout_s: 1800
    critical: false
    enabled: true
    note: "题材库增量同步 08:00（爬取+AI解释+飞书推送）"

  - job_name: j_stock_concept
    domain: D6
    target_tables: [stock_sector_map]
    schedule_cron: "20 8 * * 1-5"
    source_chain: ["longhu", "eastmoney"]
    retry_policy: {"tries": 2, "backoff_s": [30, 120]}
    timeout_s: 3600
    critical: false
    enabled: true
    note: "个股题材与行业 08:20。龙虎题材全量刷新。行业优先东财，断开时用新浪行业。没取到的股票不改旧记录"

  - job_name: j_radar
    domain: D8
    target_tables: [radar_event]
    schedule_cron: "*/30 9-15 * * 1-5"
    source_chain: ["longhu"]
    retry_policy: {"tries": 2, "backoff_s": [5, 30]}
    timeout_s: 120
    critical: false
    enabled: true
    note: "市场雷达盘中*/30（longhu适配器已就绪）"

  - job_name: j_market_messages_hot
    domain: D9
    target_tables: [market_messages]
    schedule_cron: "*/15 9-15 * * 1-5"
    source_chain: ["cls"]
    retry_policy: {"tries": 2, "backoff_s": [5, 30]}
    timeout_s: 120
    critical: false
    enabled: true
    note: "交易时段快讯 */15。只采财联社电报"

  - job_name: j_market_messages_other
    domain: D9
    target_tables: [market_messages]
    schedule_cron: "*/8 * * * *"
    source_chain: ["cls"]
    retry_policy: {"tries": 2, "backoff_s": [5, 30]}
    timeout_s: 120
    critical: false
    enabled: true
    note: "7x24快讯 */8。只采财联社电报；与 j_news_feed 不并行"

  - job_name: j_plate_intraday
    domain: D6
    target_tables: [plate_movement_intraday]
    schedule_cron: "*/5 9-15 * * 1-5"
    source_chain: ["longhu"]
    retry_policy: {"tries": 2, "backoff_s": [5, 30]}
    timeout_s: 120
    critical: false
    enabled: true
    note: "板块异动盘中5min降采样（梁总10-10批准）"

  - job_name: j_prediction_sync
    domain: D12
    target_tables: [prediction, cognition]
    schedule_cron: "0 9,18 * * 1-5"
    source_chain: ["internal"]
    retry_policy: {"tries": 1, "backoff_s": [10]}
    timeout_s: 300
    critical: false
    enabled: false
    note: "停用 2026-10-11。lovetrade 已下线，预测改由观势 POST /d12/prediction 直写。保留注册行留痕，禁止再向 prediction 覆写"

  - job_name: j_dragon_tiger
    domain: D4
    target_tables: [dragon_tiger]
    schedule_cron: "10 16 * * 1-5"
    source_chain: ["eastmoney"]
    retry_policy: {"tries": 3, "backoff_s": [5, 30, 120]}
    timeout_s: 300
    critical: false
    enabled: true
    note: "龙虎榜 16:10。东财上榜原因、买卖额，以及买卖前五席位"

  - job_name: j_northbound
    domain: D4
    target_tables: [northbound_daily]
    schedule_cron: "20 17 * * 1-5"
    source_chain: ["eastmoney"]
    retry_policy: {"tries": 2, "backoff_s": [10, 60]}
    timeout_s: 120
    critical: false
    enabled: true
    note: "北向日频。成交额未公布则记 MISS，不把南向数字写进来。公开序列停在 2024-08-16"

  - job_name: j_fundamentals
    domain: D9
    target_tables: [lockup_calendar, share_structure, financial_reports, finance_snapshot, earnings_calendar]
    schedule_cron: "30 19 * * 1-5"
    source_chain: ["eastmoney"]
    retry_policy: {"tries": 2, "backoff_s": [10, 60]}
    timeout_s: 600
    critical: false
    enabled: true
    note: "解禁、近期股本、财报更新、披露预约。f10 正文、一致预期、研报 PDF 没有迁移里的表"

  - job_name: j_hot_list
    domain: D6
    target_tables: [theme_heat]
    schedule_cron: "20 15 * * 1-5"
    source_chain: ["ths"]
    retry_policy: {"tries": 2, "backoff_s": [10, 60]}
    timeout_s: 120
    critical: false
    enabled: true
    note: "同花顺热股榜和概念热榜 15:20。休市 SKIP。东财机会榜本机 rc=102，98dou 没有可用列表，不轮询"

  - job_name: j_base_rate
    domain: D12
    target_tables: [base_rate]
    schedule_cron: "0 18 * * 5"
    source_chain: ["internal"]
    retry_policy: {"tries": 2, "backoff_s": [10, 60]}
    timeout_s: 300
    critical: false
    enabled: true
    note: "基率聚合 每周五18:00（口径spec v1.0 观势2026-10-07冻结）"

  - job_name: j_option_daily
    domain: D11
    target_tables: []
    schedule_cron: "40 15 * * 1-5"
    source_chain: ["sina"]
    retry_policy: {"tries": 1, "backoff_s": [10]}
    timeout_s: 60
    critical: false
    enabled: true
    note: "期权。新浪合约行情和东财报表都没有合约，记 MISS，不编造"

  - job_name: j_longhu_probe
    domain: D3
    target_tables: []
    schedule_cron: "30 16 * * 1-5"
    source_chain: ["longhu"]
    retry_policy: {"tries": 1, "backoff_s": [10]}
    timeout_s: 120
    critical: false
    enabled: true
    note: "交易日回报情绪、涨停回封、雷达行数。空响应不写行情表。游资和 L2 盘口不调用"
