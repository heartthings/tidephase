# 限速配置
# rps: requests per second
# burst: max burst size
# jitter_s: [min, max] random jitter (for akshare)

eastmoney:
  rps: 0.5
  burst: 2

tencent:
  rps: 2.0
  burst: 4

akshare:
  rps: 1.0
  burst: 1
  jitter_s: [0.3, 1.0]

mootdx:
  rps: 4.0
  burst: 4

sina:
  rps: 2.0
  burst: 4

# longhu: 人为限速已删除（Z7 梁总 10-10 裁决：无限速，凭证有效）
# 仅保留 429/403 反应式熔断 30min（见 longhu.py _trigger_circuit_breaker）
longhu:
  enabled: true
  circuit_breaker_seconds: 1800  # 429/403 → 熔断30min

hkex:
  rps: 0.5
  burst: 2

cninfo:
  rps: 0.5
  burst: 2

cls:
  rps: 0.5
  burst: 2

ths:
  rps: 0.5
  burst: 2

internal:
  rps: 10.0
  burst: 10
